<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>GD Render Export MP4</title>
<style>
body {
  background:#0e0e15;
  color:#fff;
  font-family:Arial;
  padding:20px;
}
input, button {
  margin:6px 0;
}
button {
  padding:8px 14px;
  font-weight:bold;
}
progress {
  width:100%;
}
</style>
</head>
<body>

<h2>🎮 Geometry Dash Render → MP4</h2>

<p>🎬 Video 1 (Level gốc)</p>
<input type="file" id="v1" accept="video/*">

<p>🧱 Video 2 (Layout + Hitbox + Click)</p>
<input type="file" id="v2" accept="video/*">

<p>🔊 MP3 Click / Nhạc</p>
<input type="file" id="audio" accept="audio/mp3">

<br>
<button onclick="exportVideo()">📦 Export MP4</button>
<progress id="prog" value="0" max="100"></progress>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/ffmpeg.min.js"></script>
<script>
const { createFFmpeg, fetchFile } = FFmpeg;
const ffmpeg = createFFmpeg({ log: true });

async function exportVideo() {
  const v1 = document.getElementById("v1").files[0];
  const v2 = document.getElementById("v2").files[0];
  const audio = document.getElementById("audio").files[0];
  const prog = document.getElementById("prog");

  if (!v1 || !v2 || !audio) {
    alert("Thiếu file rồi kìa 😅");
    return;
  }

  if (!ffmpeg.isLoaded()) await ffmpeg.load();

  ffmpeg.setProgress(p => prog.value = p.ratio * 100);

  ffmpeg.FS("writeFile", "v1.mp4", await fetchFile(v1));
  ffmpeg.FS("writeFile", "v2.mp4", await fetchFile(v2));
  ffmpeg.FS("writeFile", "audio.mp3", await fetchFile(audio));

  // concat video
  ffmpeg.FS("writeFile", "list.txt",
    new TextEncoder().encode("file v1.mp4\nfile v2.mp4\n")
  );

  await ffmpeg.run(
    "-f","concat",
    "-safe","0",
    "-i","list.txt",
    "-i","audio.mp3",
    "-c:v","libx264",
    "-c:a","aac",
    "-shortest",
    "render-gd.mp4"
  );

  const data = ffmpeg.FS("readFile", "render-gd.mp4");
  const url = URL.createObjectURL(
    new Blob([data.buffer], { type: "video/mp4" })
  );

  const a = document.createElement("a");
  a.href = url;
  a.download = "render-gd.mp4";
  a.click();
}
</script>

</body>
</html>
